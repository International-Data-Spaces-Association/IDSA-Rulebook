name: Release (Export PDF)

on:
  release:
    types: [published]
  pull_request:      # TEMP: for testing the export pipeline; remove once verified
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASENAME: IDSA-Rulebook-latest

jobs:
  export-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Concatenate documentation files listed in SUMMARY.md
        run: |
          python3 .github/scripts/assemble_from_summary.py \
            --summary documentation/SUMMARY.md \
            --out documentation/_combined.md \
            --fail-on-missing

      - name: Export PDF (Pandoc + XeLaTeX)
        uses: docker://ghcr.io/international-data-spaces-association/pandoc-latex-fonts:3.9
        with:
          args: >-
            documentation/_combined.md
            --from=markdown
            --standalone
            --toc
            --number-sections
            --pdf-engine=xelatex
            -V papersize=a4
            -V geometry:margin=2.5cm
            -V fontsize=11pt
            -V mainfont="Noto Sans"
            -V sansfont="Noto Sans"
            -V monofont="Fira Code"
            --resource-path=documentation
            --output=body.pdf

      - name: Export Front Matter (Pandoc + XeLaTeX, unnumbered, no ToC)
        uses: docker://ghcr.io/international-data-spaces-association/pandoc-latex-fonts:3.9
        with:
          args: >-
            documentation/FrontMatter.md
            --from=markdown
            --standalone
            --pdf-engine=xelatex
            -V papersize=a4
            -V geometry:margin=2.5cm
            -V fontsize=11pt
            -V mainfont="Noto Sans"
            -V sansfont="Noto Sans"
            -V monofont="Fira Code"
            --resource-path=documentation
            --output=frontmatter.pdf

      - name: Assemble final PDF (cover + front matter + body)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pypdf
          python - <<'PY'
          from pypdf import PdfWriter

          writer = PdfWriter()
          writer.append(".github/assets/coverpage.pdf")
          writer.append("frontmatter.pdf")
          writer.append("body.pdf")
          writer.write("${{ env.BASENAME }}.pdf")
          PY

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rulebook-pdf
          path: ${{ env.BASENAME }}.pdf
          if-no-files-found: error

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BASENAME }}.pdf